<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>og render 1200x630</title>
<!--
  Not a page of the site. This is the source for assets/img/og.png, the picture
  that shows up when someone pastes a bluetomatostudio.com link into a message.
  To rebuild it, see the "Rebuilding the pictures" part of README.md.
-->
<style>
  @font-face {
    font-family: "Fraunces";
    src: url("assets/fonts/Fraunces-VF.woff2") format("woff2");
    font-weight: 300 650; font-style: normal;
  }
  * { box-sizing: border-box; margin: 0; }
  body {
    width: 1200px; height: 630px; overflow: hidden;
    background: #FFFFFF;
    color: #16202B;
    font-family: -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
    display: grid; grid-template-columns: 1fr 470px; align-items: center;
    padding: 0 78px;
  }
  .brand { display: flex; align-items: center; gap: 14px; margin-bottom: 34px; }
  .brand img { width: 42px; height: 42px; display: block; }
  .brand b { font-family: "Fraunces", Georgia, serif; font-size: 28px; font-weight: 600; letter-spacing: -.02em; }
  h1 {
    font-family: "Fraunces", Georgia, serif;
    font-size: 70px; font-weight: 540; line-height: 1.07; letter-spacing: -.022em;
  }
  h1 .soft { color: #6B7887; }
  p { font-size: 23px; color: #4C5A68; margin-top: 22px; max-width: 26ch; }
  .art { position: relative; display: flex; justify-content: center; }
  .art::before {
    content: ""; position: absolute; inset: 4% 2% 8% 2%; border-radius: 50%;
    background: radial-gradient(circle at 46% 42%, #EAF4FD, transparent 68%);
  }
  .art img { position: relative; width: 420px; height: 420px; display: block; }
</style>
</head>
<body>
  <div>
    <div class="brand">
      <img src="assets/img/mark.png" alt="">
      <b>Blue Tomato Studio</b>
    </div>
    <h1>Small apps that<br><span class="soft">do one thing.</span></h1>
    <p>Three of them, for Mac and iPhone.</p>
  </div>
  <div class="art">
    <img src="assets/img/tomato-art.png" alt="">
  </div>
</body>
</html>
