<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 60" preserveAspectRatio="none">
  <!-- Scribbled over, not underlined. Five passes of a marker going back and
       forth, none level, none the same length, ends overshooting. The white
       gaps between the passes are the whole point: without them it squashes
       into a flat bar and stops reading as a scribble. Stretched to fit
       whatever word sits on top, which is why preserveAspectRatio is off. -->
  <g fill="none" stroke-linecap="round" stroke="#8FC8F3">
    <path stroke-width="9" d="M5 21c48-10 96 9 146-1 46-9 96 7 148-10"/>
    <path stroke-width="8" d="M297 34c-52 10-104-9-152 2-48 11-98-6-141 6"/>
    <path stroke-width="7" d="M12 47c56-8 112 9 168 1 34-5 66-2 106 5"/>
  </g>
  <g fill="none" stroke-linecap="round" stroke="#BFDEFA">
    <path stroke-width="6" d="M38 11c62 7 124-9 188 3"/>
    <path stroke-width="5" d="M272 55c-62 6-124-7-186 2"/>
  </g>
</svg>
